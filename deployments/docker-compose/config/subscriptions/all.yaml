apiVersion: cloud-streams.io/v1
kind: Subscription
metadata:
  name: all
spec:
  subscriber:
    endpoint: https://events.k.ccie.cisco.com/events/pub
    retryPolicy:
      statusCodes: [ 503 ]
      backoffDuration:
        type: constant
        period: PT3S
      maxAttempts: 5
      circuitBreaker:
        breakAfter: 3
        breakDuration: PT5S
  stream:
    offset: -1
