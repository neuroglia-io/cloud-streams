# Default values of the Cloud Streams chart.
# EventStoreDB and Redis are not deployed by the chart: point it at existing ones.

image:
  registry: ghcr.io
  # the gateway and broker images are '<repositoryPrefix>-gateway' and '<repositoryPrefix>-broker'
  repositoryPrefix: neuroglia-io/cloud-streams
  # defaults to the chart's appVersion
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# The EventStoreDB that stores the cloud events, e.g. 'esdb://eventstore:2113?tls=false'
eventstore:
  connectionString: ""
  # use an existing secret rather than 'connectionString', which is then ignored
  existingSecret: ""
  existingSecretKey: eventstore

# The Redis that stores resources, leases and the partition index, e.g. 'redis:6379'
redis:
  connectionString: ""
  existingSecret: ""
  existingSecretKey: redis

# The retention policy of the cloud event stream, which gateways apply at startup (see the README's 'Retention' section).
# Leave both empty to keep events forever and leave any policy set otherwise as it is; set both to 0 to remove a policy.
retention:
  # an ISO 8601 duration, e.g. 'P30D'
  maxAge: ""
  # e.g. 1000000
  maxCount: ""

telemetry:
  # the OTLP endpoint traces, metrics and logs are exported to, if any, e.g. 'http://otel-collector:4317'
  otlpEndpoint: ""

# where the broker and the gateway read the secrets of authenticated endpoints from, e.g. those of sinks and feeds (see the README's 'Transports' section)
secrets:
  # the providers secrets are read from, in the order a secret named without a provider is looked for: env, file, kubernetes and vault
  providers: [ env, file ]
  # the Cloud Streams namespaces that may read shared secrets, i.e. those that belong to no namespace, besides their own (see the README's 'Namespaces'
  # section). Defaults to [ default ]; [ "*" ] shares them with every namespace
  sharedWith: []
  # Kubernetes secrets mounted as files, which the 'file' provider reads: each key of a secret is the file /var/run/secrets/cloud-streams/<name>/<key>
  # e.g. [ { name: orders-kafka, secretName: kafka-credentials } ]
  files: []
  kubernetes:
    # creates a role that lets the service account get the secrets of the release's namespace, which the 'kubernetes' provider reads. Only secrets labelled
    # 'cloud-streams.io/secret=true' are read: the role cannot restrict secrets by label, so restrict it further with resourceNames if needed
    # A secret labelled 'cloud-streams.io/namespace=<namespace>' belongs to that Cloud Streams namespace: only its resources may read it
    rbac: false
    resourceNames: []
  vault:
    # the address of Vault, which the 'vault' provider reads secrets from, e.g. 'https://vault.vault.svc:8200'
    address: ""
    mount: secret
    kvVersion: 2
    prefix: ""
    # token (from existingSecret), kubernetes (with the pod's service account) or approle (role id and secret id from existingSecret)
    authentication:
      method: kubernetes
      role: cloud-streams
      # a secret holding the 'token', or the 'roleId' and 'secretId'
      existingSecret: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1654
  runAsGroup: 1654
  fsGroup: 1654
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]

# The gateways to deploy, each serving one gateway resource of a namespace, whose events belong to that namespace (see the README's 'Namespaces'
# section). Each item names its gateway and namespace, and overrides any setting of 'gateway', e.g.
#   gateways:
#     - name: orders
#       namespace: tenant-a
#       replicaCount: 3
#       ingress: { enabled: true, hosts: [ { host: orders.example.com, paths: [ { path: /, pathType: Prefix } ] } ] }
#     - name: billing
#       namespace: tenant-b
#       managementApi: { enabled: false }
# Their objects are named '<fullname>-gateway-<namespace>-<name>', unless an item sets 'fullnameOverride'. When the list is empty, a single gateway
# is deployed with the settings of 'gateway'
gateways: []

# The settings of the gateways, which the items of 'gateways' override
gateway:
  enabled: true
  # the name of the gateway resource, shared by its replicas, when 'gateways' is empty. Defaults to '<fullname>-gateway'
  name: ""
  # the namespace of the gateway resource, which the events it ingests belong to, when 'gateways' is empty
  namespace: default
  replicaCount: 2
  port: 8080
  # serve the management API (resources, dashboard, hubs and MCP) on a dedicated port, kept off the public ingress (see the README's 'Exposure' section)
  managementApi:
    enabled: true
    port: ""
  service:
    type: ClusterIP
    annotations: {}
  # exposes the public endpoints: ingestion, acknowledgements and health checks, and the management API unless it has a dedicated port
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: cloud-streams.example.com
        paths:
          - path: /
            pathType: Prefix
    tls: []
  # exposes the management API on its dedicated port, e.g. on an internal ingress class
  managementIngress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: cloud-streams-admin.example.com
        paths:
          - path: /
            pathType: Prefix
    tls: []
  # extra environment variables, e.g. to configure authentication: Authentication__Dashboard__Enabled, Oidc__Authority...
  env: []
  envFrom: []
  resources: {}
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1

# The brokers to deploy, each serving one broker resource of a namespace, which delivers the subscriptions of that namespace only. Each item names
# its broker and namespace, and overrides any setting of 'broker', e.g.
#   brokers:
#     - name: orders
#       namespace: tenant-a
#     - name: billing
#       namespace: tenant-b
#       replicaCount: 1
# Their objects are named '<fullname>-broker-<namespace>-<name>', unless an item sets 'fullnameOverride'. When the list is empty, a single broker is
# deployed with the settings of 'broker'
brokers: []

# The settings of the brokers, which the items of 'brokers' override
broker:
  enabled: true
  # the name of the broker resource, shared by its replicas, which split its subscriptions with leases, when 'brokers' is empty. Defaults to '<fullname>-broker'
  name: ""
  # the namespace of the broker resource, whose subscriptions it delivers, when 'brokers' is empty
  namespace: default
  replicaCount: 2
  port: 8080
  service:
    type: ClusterIP
    annotations: {}
  env: []
  envFrom: []
  resources: {}
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1

probes:
  liveness:
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
