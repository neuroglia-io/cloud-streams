{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cloud-streams.serviceAccountName" . }}
  labels:
    {{- include "cloud-streams.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Cloud Streams does not call the Kubernetes API
automountServiceAccountToken: false
{{- end }}
