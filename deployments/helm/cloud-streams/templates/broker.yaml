{{- range $values := (include "cloud-streams.instances" (dict "root" . "component" "broker") | fromJson).items }}
{{- if $values.enabled }}
{{- $selector := dict "root" $ "component" "broker" "instance" $values }}
{{- $fullname := $values.objectName }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "cloud-streams.labels" $ | nindent 4 }}
    app.kubernetes.io/component: broker
spec:
  replicas: {{ $values.replicaCount }}
  selector:
    matchLabels:
      {{- include "cloud-streams.instanceSelectorLabels" $selector | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cloud-streams.instanceSelectorLabels" $selector | nindent 8 }}
        {{- with $values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/connections: {{ printf "%s|%s" $.Values.eventstore.connectionString $.Values.redis.connectionString | sha256sum }}
        {{- with $values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "cloud-streams.serviceAccountName" $ }}
      automountServiceAccountToken: {{ include "cloud-streams.needsServiceAccountToken" $ }}
      # the variables Kubernetes would inject for every service of the namespace are not used, and some applications mistake them for their own settings
      enableServiceLinks: false
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      # a broker that stops gracefully releases its subscriptions, so that the other replicas take them over at once
      terminationGracePeriodSeconds: 30
      {{- with $.Values.secrets.files }}
      volumes:
        {{- include "cloud-streams.secretVolumes" $ | nindent 8 }}
      {{- end }}
      containers:
        - name: broker
          image: {{ include "cloud-streams.image" (dict "root" $ "component" "broker") }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          securityContext:
            {{- toYaml $.Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ $values.port }}
          env:
            - name: ASPNETCORE_HTTP_PORTS
              value: {{ $values.port | quote }}
            - name: CLOUDSTREAMS_BROKER_NAME
              value: {{ $values.name | quote }}
            - name: CLOUDSTREAMS_BROKER_NAMESPACE
              value: {{ $values.namespace | quote }}
            {{- include "cloud-streams.commonEnv" $ | nindent 12 }}
            {{- include "cloud-streams.secretsEnv" $ | nindent 12 }}
            {{- with $values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with $values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $.Values.secrets.files }}
          volumeMounts:
            {{- include "cloud-streams.secretVolumeMounts" $ | nindent 12 }}
          {{- end }}
          {{- include "cloud-streams.probes" (dict "root" $ "port" "http") | nindent 10 }}
          {{- with $values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with $values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
# the broker serves its health checks, which gateways probe when the broker's 'spec.service' points at this service
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "cloud-streams.labels" $ | nindent 4 }}
    app.kubernetes.io/component: broker
  {{- with $values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $values.service.type }}
  selector:
    {{- include "cloud-streams.instanceSelectorLabels" $selector | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
{{- if $values.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "cloud-streams.labels" $ | nindent 4 }}
    app.kubernetes.io/component: broker
spec:
  maxUnavailable: {{ $values.podDisruptionBudget.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "cloud-streams.instanceSelectorLabels" $selector | nindent 6 }}
{{- end }}
{{- end }}
{{- end }}
