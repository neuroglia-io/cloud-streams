{{- if or (not .Values.eventstore.existingSecret) (not .Values.redis.existingSecret) }}
{{- if and (not .Values.eventstore.existingSecret) (not .Values.eventstore.connectionString) }}
{{- fail "Set 'eventstore.connectionString', or 'eventstore.existingSecret'" }}
{{- end }}
{{- if and (not .Values.redis.existingSecret) (not .Values.redis.connectionString) }}
{{- fail "Set 'redis.connectionString', or 'redis.existingSecret'" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cloud-streams.secretName" . }}
  labels:
    {{- include "cloud-streams.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if not .Values.eventstore.existingSecret }}
  eventstore: {{ .Values.eventstore.connectionString | quote }}
  {{- end }}
  {{- if not .Values.redis.existingSecret }}
  redis: {{ .Values.redis.connectionString | quote }}
  {{- end }}
{{- end }}
