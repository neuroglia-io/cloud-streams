{{- range $values := (include "cloud-streams.instances" (dict "root" . "component" "gateway") | fromJson).items }}
{{- if $values.enabled }}
{{- $selector := dict "root" $ "component" "gateway" "instance" $values }}
{{- $managementPort := $values.managementApi.port | toString }}
{{- $dedicated := and $values.managementApi.enabled (ne $managementPort "") }}
{{- $fullname := $values.objectName }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "cloud-streams.labels" $ | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  replicas: {{ $values.replicaCount }}
  selector:
    matchLabels:
      {{- include "cloud-streams.instanceSelectorLabels" $selector | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cloud-streams.instanceSelectorLabels" $selector | nindent 8 }}
        {{- with $values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # the pods restart when the connection strings change
        checksum/connections: {{ printf "%s|%s" $.Values.eventstore.connectionString $.Values.redis.connectionString | sha256sum }}
        {{- with $values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "cloud-streams.serviceAccountName" $ }}
      automountServiceAccountToken: {{ include "cloud-streams.needsServiceAccountToken" $ }}
      # the variables Kubernetes would inject for every service of the namespace are not used, and some applications mistake them for their own settings
      enableServiceLinks: false
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      {{- with $.Values.secrets.files }}
      volumes:
        {{- include "cloud-streams.secretVolumes" $ | nindent 8 }}
      {{- end }}
      containers:
        - name: gateway
          image: {{ include "cloud-streams.image" (dict "root" $ "component" "gateway") }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          securityContext:
            {{- toYaml $.Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ $values.port }}
            {{- if $dedicated }}
            - name: management
              containerPort: {{ $managementPort }}
            {{- end }}
          env:
            - name: ASPNETCORE_HTTP_PORTS
              value: {{ if $dedicated }}{{ printf "%v;%s" $values.port $managementPort | quote }}{{ else }}{{ $values.port | quote }}{{ end }}
            - name: CLOUDSTREAMS_GATEWAY_NAME
              value: {{ $values.name | quote }}
            - name: CLOUDSTREAMS_GATEWAY_NAMESPACE
              value: {{ $values.namespace | quote }}
            - name: ManagementApi__Enabled
              value: {{ $values.managementApi.enabled | quote }}
            {{- if $dedicated }}
            - name: ManagementApi__Port
              value: {{ $managementPort | quote }}
            {{- end }}
            {{- with $.Values.retention.maxAge }}
            - name: Retention__MaxAge
              value: {{ . | quote }}
            {{- end }}
            {{- if ne (toString $.Values.retention.maxCount) "" }}
            - name: Retention__MaxCount
              value: {{ $.Values.retention.maxCount | toString | quote }}
            {{- end }}
            {{- include "cloud-streams.commonEnv" $ | nindent 12 }}
            {{- include "cloud-streams.secretsEnv" $ | nindent 12 }}
            {{- with $values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with $values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $.Values.secrets.files }}
          volumeMounts:
            {{- include "cloud-streams.secretVolumeMounts" $ | nindent 12 }}
          {{- end }}
          {{- include "cloud-streams.probes" (dict "root" $ "port" "http") | nindent 10 }}
          {{- with $values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with $values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "cloud-streams.labels" $ | nindent 4 }}
    app.kubernetes.io/component: gateway
  {{- with $values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $values.service.type }}
  selector:
    {{- include "cloud-streams.instanceSelectorLabels" $selector | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
    {{- if $dedicated }}
    - name: management
      port: {{ $managementPort }}
      targetPort: management
    {{- end }}
{{- range $ingress := list (dict "key" "ingress" "suffix" "" "port" "http") (dict "key" "managementIngress" "suffix" "-management" "port" (ternary "management" "http" $dedicated)) }}
{{- $values := index $.Values.gateway $ingress.key }}
{{- if $values.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ printf "%s%s" $fullname $ingress.suffix }}
  labels:
    {{- include "cloud-streams.labels" $ | nindent 4 }}
    app.kubernetes.io/component: gateway
  {{- with $values.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $values.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with $values.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range $values.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ $fullname }}
                port:
                  name: {{ $ingress.port }}
          {{- end }}
    {{- end }}
{{- end }}
{{- end }}
{{- if $values.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "cloud-streams.labels" $ | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  maxUnavailable: {{ $values.podDisruptionBudget.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "cloud-streams.instanceSelectorLabels" $selector | nindent 6 }}
{{- end }}
{{- end }}
{{- end }}
