# EventStoreDB and Redis for a disposable cluster, e.g. kind, which the end-to-end tests of the Kubernetes mode install the chart on.
# Neither is persistent nor secured: never use them beyond tests
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eventstore
  labels:
    app: eventstore
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eventstore
  template:
    metadata:
      labels:
        app: eventstore
    spec:
      # Kubernetes would inject EVENTSTORE_SERVICE_PORT and the like for the 'eventstore' service, which EventStoreDB refuses as unknown options
      enableServiceLinks: false
      containers:
        - name: eventstore
          image: eventstore/eventstore:24.10.6
          env:
            - name: EVENTSTORE_INSECURE
              value: "true"
            - name: EVENTSTORE_MEM_DB
              value: "true"
            - name: EVENTSTORE_RUN_PROJECTIONS
              value: all
            - name: EVENTSTORE_START_STANDARD_PROJECTIONS
              value: "true"
          ports:
            - containerPort: 2113
          readinessProbe:
            httpGet:
              path: /health/live
              port: 2113
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: eventstore
spec:
  selector:
    app: eventstore
  ports:
    - port: 2113
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: [ redis-cli, ping ]
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector:
    app: redis
  ports:
    - port: 6379
