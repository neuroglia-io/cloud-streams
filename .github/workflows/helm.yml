name: Helm chart

on:
  pull_request:
    paths:
      - 'deployments/helm/**'
      - '.github/workflows/helm.yml'
  push:
    branches: [ main ]
    paths:
      - 'deployments/helm/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint and render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Helm
        uses: azure/setup-helm@v4
      - name: Lint
        run: helm lint deployments/helm/cloud-streams --strict --set eventstore.connectionString=esdb://eventstore:2113 --set redis.connectionString=redis:6379
      - name: Render
        run: |
          set -euo pipefail
          chart=deployments/helm/cloud-streams
          # the defaults, with connection strings
          helm template cs "$chart" --set eventstore.connectionString=esdb://eventstore:2113 --set redis.connectionString=redis:6379 > /dev/null
          # every optional feature at once
          helm template cs "$chart" --set eventstore.existingSecret=connections --set redis.existingSecret=connections \
            --set gateway.managementApi.port=8081 --set gateway.ingress.enabled=true --set gateway.managementIngress.enabled=true \
            --set retention.maxAge=P30D --set retention.maxCount=1000000 --set telemetry.otlpEndpoint=http://otel:4317 > /dev/null
          # gateways and brokers of several namespaces, which get their own objects and selectors
          connections="--set eventstore.connectionString=esdb://eventstore:2113 --set redis.connectionString=redis:6379"
          instances="--set gateways[0].name=orders,gateways[0].namespace=tenant-a,gateways[1].name=billing,gateways[1].namespace=tenant-b --set brokers[0].name=orders,brokers[0].namespace=tenant-a --set secrets.sharedWith[0]=tenant-a"
          rendered=$(helm template cs "$chart" $connections $instances)
          test "$(grep -c '^kind: Deployment' <<< "$rendered")" -eq 3
          grep -q 'cloud-streams.io/gateway: "tenant-b.billing"' <<< "$rendered"
          # a gateway may only be listed once
          if helm template cs "$chart" $connections --set gateways[0].name=orders,gateways[1].name=orders > /dev/null 2>&1; then echo "listing a gateway twice should fail"; exit 1; fi
          # the connection strings are required
          if helm template cs "$chart" > /dev/null 2>&1; then echo "rendering without connection strings should fail"; exit 1; fi
          # the Kubernetes mode deploys the operator, its webhook and the API, and declares the gateways and brokers, which the operator deploys
          kubernetes="--kube-version 1.31.0 --set resources.store=kubernetes"
          rendered=$(helm template cs "$chart" $connections $instances $kubernetes)
          test "$(grep -c '^kind: Deployment' <<< "$rendered")" -eq 2
          grep -q '^kind: ValidatingWebhookConfiguration' <<< "$rendered"
          grep -q 'rbac.authorization.k8s.io/aggregate-to-view: "true"' <<< "$rendered"
          grep -q '\\"kind\\":\\"Gateway\\",\\"metadata\\":{\\"name\\":\\"billing\\",\\"namespace\\":\\"tenant-b\\"}' <<< "$rendered"
          # with cert-manager, and an API restricted to some namespaces
          helm template cs "$chart" $connections $kubernetes --set operator.webhook.certManager.enabled=true --set api.namespaces[0]=tenant-a > /dev/null
          # the Kubernetes mode requires Kubernetes 1.30, and refuses the settings it can't honour
          if helm template cs "$chart" $connections --kube-version 1.29.0 --set resources.store=kubernetes > /dev/null 2>&1; then echo "the Kubernetes mode should require Kubernetes 1.30"; exit 1; fi
          if helm template cs "$chart" $connections $kubernetes --set gateways[0].name=orders,gateways[0].env[0].name=X > /dev/null 2>&1; then echo "per-item env should be refused in Kubernetes mode"; exit 1; fi
          if helm template cs "$chart" $connections --set resources.store=etcd > /dev/null 2>&1; then echo "an unknown store should be refused"; exit 1; fi
