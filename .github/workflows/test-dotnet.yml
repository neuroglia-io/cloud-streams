name: .NET

on:
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '.github/**'
      - '**/*.md'
      - 'assets/**'
      - 'deployments/**'
  workflow_call:

permissions:
  contents: read

env:
  SOLUTION: ./CloudStreams.sln

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dotnet-version: ['9.0.x' ]

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup .NET ${{ matrix.dotnet-version }}
        uses: actions/setup-dotnet@v2
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      - name: Restore dependencies
        run: dotnet restore "${{ env.SOLUTION }}"

      # - name: Test
      #   run: dotnet test "${{ env.SOLUTION }}" --no-restore --verbosity normal"

      # Test "per domain" for ease of readability
      # NOTE: a --filter that matches nothing exits 0, so a domain with no tests - or a typo in the
      # filter - reports green. Every domain that has tests needs its own step here or it never runs.
      - name: Test Core
        run: dotnet test "${{ env.SOLUTION }}" --no-restore --filter "FullyQualifiedName~Cases.Core"

      - name: Test Broker
        run: dotnet test "${{ env.SOLUTION }}" --no-restore --filter "FullyQualifiedName~Cases.Broker"
      # ...