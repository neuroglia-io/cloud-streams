name: .NET

on:
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - 'assets/**'
  workflow_call:

permissions:
  contents: read

env:
  SOLUTION: ./CloudStreams.sln

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore "${{ env.SOLUTION }}"

      - name: Build
        run: dotnet build "${{ env.SOLUTION }}" --configuration Release --no-restore

      # Every test of every test project runs: no filter, so that no test can be left out by a filter that matches nothing
      - name: Test
        run: >
          dotnet test "${{ env.SOLUTION }}" --configuration Release --no-build
          --logger "trx" --logger "console;verbosity=normal"
          --collect "XPlat Code Coverage" --results-directory ./test-results

      - name: Report coverage
        if: ${{ !cancelled() }}
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          reportgenerator -reports:"./test-results/**/coverage.cobertura.xml" -targetdir:./test-results/coverage -reporttypes:"MarkdownSummaryGithub;Cobertura;HtmlSummary"
          cat ./test-results/coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./test-results
          retention-days: 14
