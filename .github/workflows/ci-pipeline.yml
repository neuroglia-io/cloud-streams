name: Continuous integration

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '.github/**'
      - '**/*.md'
      - 'assets/**'
      - 'deployments/**'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

# Every run pushes a version commit to main, so two runs triggered by merges landing close together must never
# version concurrently: the second push would be rejected as non-fast-forward. Runs are queued, never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:

  versioning:
    if: github.repository == 'neuroglia-io/cloud-streams' && github.ref_name == 'main'
    uses: ./.github/workflows/versioning.yml
    secrets: inherit

  build:
    needs: [versioning]
    uses: ./.github/workflows/build-dotnet.yml
    secrets: inherit

  test:
    needs: [versioning]
    uses: ./.github/workflows/test-dotnet.yml
    secrets: inherit

  release:
    needs: [build, test]
    uses: ./.github/workflows/release.yml
    secrets: inherit
