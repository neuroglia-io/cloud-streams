apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: subscriptions.cloud-streams.io
spec:
  scope: Cluster
  group: cloud-streams.io
  names:
    plural: subscriptions
    singular: subscription
    kind: Subscription
    shortNames:
    - sub
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                partition:
                  type: object
                  properties:
                    type:
                      type: string
                      enum:
                        - by-source
                        - by-type
                        - by-subject
                        - by-correlation-id
                        - by-causation-id
                    id:
                      type: string
                  required:
                    - type
                    - id
                filter:
                  type: object
                  properties:
                    type:
                      type: string
                      enum:
                        - attributes
                        - expression
                    attributes:
                      type: object
                    expression:
                      type: string
                  oneOf:
                    - properties:
                        type:
                          enum: 
                            - attributes
                      required:
                        - type
                        - attributes
                    - properties:
                        type:
                          enum: 
                            - expression
                      required:
                        - type
                        - expression
                mutation:
                  type: object
                  properties:
                    type:
                      type: string
                      enum:
                        - expression
                        - webhook
                    expression:
                      type: [ string, object ]
                      description: A runtime expression that evaluates to the mutated cloud event, or an object whose values may be runtime expressions
                    webhook:
                      type: object
                      properties:
                        serviceUri:
                          type: string
                          format: url
                  oneOf:
                    - properties:
                        type:
                          enum: 
                            - expression
                      required:
                        - type
                        - expression
                    - properties:
                        type:
                          enum: 
                            - webhook
                      required:
                        - type
                        - webhook
                stream:
                  type: object
                  properties:
                    offset:
                      type: number
                subscriber:
                  type: object
                  properties:
                    uri:
                      type: string
                      format: url
                    rateLimit:
                      type: number
                      exclusiveMinimum: 0
                    retryPolicy:
                      type: object
                      properties:
                        statusCodes:
                          type: array
                          items:
                            type: number
                        circuitBreaker:
                          type: object
                          properties:
                            breakAfter:
                              type: integer
                            breakDuration:
                              type: string
                          required:
                            - breakAfter
                            - breakDuration
                        backoffDuration:
                          type: object
                          properties:
                            type:
                              type: string
                              enum:
                                - constant
                                - incremental
                                - exponential
                            period:
                              type: string
                            exponent:
                              type: number
                              exclusiveMinimum: 0
                              description: The exponent of an exponential backoff. Required by exponential backoffs
                            maxDelay:
                              type: string
                              description: The maximum amount of time, as an ISO 8601 duration, to wait between two retry attempts. Defaults to PT1H
                          oneOf:
                            - properties:
                                type:
                                  enum: 
                                    - constant
                              required:
                                - type
                                - period
                            - properties:
                                type: 
                                  enum: 
                                    - incremental
                              required:
                                - type
                                - period
                            - properties:
                                type:
                                  enum: 
                                    - exponential
                              required:
                                - type
                                - period
                                - exponent 
                        maxAttempts:
                          type: integer
                          description: The maximum amount of retry attempts to perform. Defaults to 5. Set to a negative value to retry forever
                      required:
                        - backoffDuration
                    timeout:
                      type: string
                      description: The maximum amount of time, as an ISO 8601 duration, to wait for the subscriber to respond to a single delivery attempt. Defaults to the broker dispatch timeout
                    ack:
                      type: object
                      description: Configures the deferred acknowledgement of the cloud events delivered to the subscriber, which defers an acknowledgement by responding 202 Accepted
                      properties:
                        timeout:
                          type: string
                          description: The maximum amount of time, as an ISO 8601 duration, a cloud event whose acknowledgement has been deferred may remain unacknowledged before it is redelivered. Defaults to the broker setting, or PT5M
                    batch:
                      type: object
                      description: Delivers cloud events in batches, as application/cloudevents-batch+json. Excludes 'ordering', and deferred acknowledgements
                      properties:
                        maxSize:
                          type: integer
                          minimum: 1
                          description: The maximum amount of cloud events per batch
                        linger:
                          type: string
                          description: The maximum amount of time, as an ISO 8601 duration, to wait for a batch to fill once the subscription has caught up. Defaults to none
                      required: [ maxSize ]
                    ordering:
                      type: object
                      description: Delivers cloud events in parallel, in order per key. Excludes 'batch', and deferred acknowledgements
                      properties:
                        key:
                          type: string
                          pattern: '^[a-z0-9]+$'
                          description: The context attribute whose value is the key cloud events are ordered by, e.g. subject
                        maxConcurrency:
                          type: integer
                          minimum: 1
                          description: The maximum amount of keys whose cloud events are delivered concurrently. Defaults to 8
                      required: [ key ]
                  required:
                    - uri
                deadLetter:
                  type: object
                  description: Sets aside the cloud events the subscription fails to deliver, rather than faulting the subscription or dropping them
                  properties:
                    uri:
                      type: string
                      format: url
                      description: The uri of the service to send dead-lettered cloud events to. If not set, they are stored in the subscription's dead-letter stream
                suspended:
                  type: boolean
                  description: Whether or not the subscription is suspended. While it is, nothing is delivered, and its offset is kept, so that delivery resumes where it stopped
              required:
                - subscriber
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum:
                    - inactive
                    - active
                    - suspended
                observedGeneration:
                  type: number
                stream:
                  type: object
                  properties:
                    ackedOffset:
                      type: number
                    fault:
                      type: object
                      properties:
                        type:
                          type: string
                          format: url
                        title:
                          type: string
                        status:
                          type: integer
                        detail:
                          type: string
                        instance:
                          type: string
                          format: url
                        errors:
                          type: array
                          items:
                            type: object
                      required:
                        - type
                        - title
                        - status
                subscriber:
                  type: object
                  properties:
                    state:
                      type: string
                      enum:
                        - unknown
                        - reachable
                        - unreachable
                    reason:
                      type: string
                    pendingAck:
                      type: object
                      description: The cloud event whose acknowledgement the subscriber has deferred, if any
                      properties:
                        offset:
                          type: number
                        token:
                          type: string
                        expiresAt:
                          type: string
                          format: date-time
                      required:
                        - offset
                        - token
                        - expiresAt
                    lastAcknowledgedAt:
                      type: string
                      format: date-time
          required:
            - spec
      subresources:
        status: {}