apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: gateways.cloud-streams.io
spec:
  scope: Namespaced
  group: cloud-streams.io
  names:
    plural: gateways
    singular: gateway
    kind: Gateway
    shortNames:
    - gw
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                authorization:
                  type: object
                  properties:
                    decisionStrategy: 
                      type: string
                      enum:
                        - consensus
                        - minority
                        - unanimous
                      default: unanimous
                    rules:
                      type: array
                      items:
                        type: object
                        properties:
                          type:
                            type: string
                          attributeName:
                            type: string
                          attributeValue:
                            type: string
                          maxSize:
                            type: number
                          from:
                            type: string
                            format: date-time
                          to:
                            type: string
                            format: date-time
                        anyOf:
                          - properties:
                              type:
                                const: attribute
                            required:
                              - type
                              - attributeName
                          - properties:
                              type:
                                const: payload
                            required:
                              - type
                              - maxSize
                          - properties:
                              type:
                                const: timeOfDay
                            required:
                              - type
                              - from
                              - to
                          - properties:
                              type:
                                const: temporary
                            required:
                              - type
                              - from
                              - to
                validation:
                  type: object
                  properties:
                    skip:
                      type: boolean
                    validationStrategy:
                      type: string
                      enum:
                        - none
                        - warn
                        - fail
                      default: fail
                    dataSchema:
                      type: object
                      properties:
                        required:
                          type: boolean
                          default: true
                        autoGenerate:
                          type: boolean
                sources:
                  type: array
                  items:
                    type: object
                    properties:
                      uri:
                        type: string
                        format: uri
                      authorization:
                        type: object
                        properties:
                          decisionStrategy: 
                            type: string
                            enum:
                              - consensus
                              - minority
                              - unanimous
                            default: unanimous
                          rules:
                            type: array
                            items:
                              type: object
                              properties:
                                type:
                                  type: string
                                attributeName:
                                  type: string
                                attributeValue:
                                  type: string
                                maxSize:
                                  type: number
                                from:
                                  type: string
                                  format: date-time
                                to:
                                  type: string
                                  format: date-time
                              anyOf:
                                - properties:
                                    type:
                                      const: attribute
                                  required:
                                    - type
                                    - attributeName
                                - properties:
                                    type:
                                      const: payload
                                  required:
                                    - type
                                    - maxSize
                                - properties:
                                    type:
                                      const: timeOfDay
                                  required:
                                    - type
                                    - from
                                    - to
                                - properties:
                                    type:
                                      const: temporary
                                  required:
                                    - type
                                    - from
                                    - to
                      validation:
                       type: object
                       properties:
                         skip:
                           type: boolean
                         validationStrategy:
                           type: string
                           enum:
                             - none
                             - warn
                             - fail
                           default: fail
                         dataSchema:
                           type: object
                           properties:
                             required:
                               type: boolean
                               default: true
                             autoGenerate:
                               type: boolean
                    required:
                      - uri
                events:
                  type: array
                  items:
                    type: object
                    properties:
                      source:
                        type: string
                      type:
                        type: string
                      metadata:
                        type: object
                        properties:
                          properties:
                            type: array
                            items:
                              type: object
                              properties:
                                name:
                                  type: string
                                strategy:
                                  type: string
                                  enum:
                                    - attribute
                                    - expression
                                attribute:
                                  type: object
                                  properties:
                                    name:
                                      type: string
                                    value:
                                      type: string
                                  required:
                                    - name
                                expression:
                                  type: string
                              anyOf:
                                - properties:
                                    strategy:
                                      const: attribute
                                  required:
                                    - name
                                    - attribute
                                - properties:
                                    strategy:
                                      const: expression
                                  required:
                                    - name
                                    - expression
                      schema:
                        type: object
                        description: The registered schema the data of the cloud events the configuration applies to must be valid against
                        properties:
                          name:
                            type: string
                          version:
                            type: integer
                            minimum: 1
                            description: The version of the schema. Defaults to the latest one
                        required:
                          - name
                    required:
                      - source
                      - type
                splitHorizon:
                  type: object
                  description: Configures how the gateway detects and handles events that loop between gateways
                  properties:
                    originAttribute:
                      type: string
                      pattern: '^[a-z0-9]+$'
                      description: The name of the extension attribute used to track the gateways an event went through. Defaults to 'origin'
                    trackingMode:
                      type: string
                      enum:
                        - single
                        - chain
                    evaluationMode:
                      type: string
                      enum:
                        - last
                        - contains
                        - single
                    loopAction:
                      type: string
                      enum:
                        - ignore
                        - reject
                        - forward
                    maxChainLength:
                      type: integer
                      minimum: 1
                      description: The maximum amount of gateways an event may have gone through. Only applies when 'trackingMode' is 'chain'
                    allowedOrigins:
                      type: array
                      items:
                        type: string
                    excludedOrigins:
                      type: array
                      items:
                        type: string
                service:
                  type: object
                  properties:
                    uri:
                      type: string
                      format: uri
                    healthChecks:
                      type: object
                      properties:
                        request:
                          type: object
                          properties:
                            method:
                              type: string
                            path:
                              type: string
                            headers:
                              type: object
                              x-kubernetes-preserve-unknown-fields: true
                            body:
                              type: object
                              x-kubernetes-preserve-unknown-fields: true
                          required: [ method, path ]
                        interval:
                          type: string
                          pattern: '^P([0-9]+(?:[,\.][0-9]+)?Y)?([0-9]+(?:[,\.][0-9]+)?M)?([0-9]+(?:[,\.][0-9]+)?D)?(?:T([0-9]+(?:[,\.][0-9]+)?H)?([0-9]+(?:[,\.][0-9]+)?M)?([0-9]+(?:[,\.][0-9]+)?S)?)?$'
                      required: [ request ]
                  required:
                    - uri
                ingestion:
                  type: object
                  description: Configures how the gateway ingests cloud events
                  properties:
                    maxRequestBodySize:
                      type: integer
                      minimum: 1
                      description: The maximum size, in bytes, of an ingestion request. Defaults to the server's limit
                    maxBatchSize:
                      type: integer
                      minimum: 1
                      description: The maximum amount of cloud events a batch may contain. Unlimited if not set
                    deduplication:
                      type: object
                      description: Deduplicates cloud events by source and id. Cloud events are not deduplicated if not set
                      properties:
                        window:
                          type: string
                          description: How long, as an ISO 8601 duration, a stored cloud event is remembered, and its duplicates ignored
                      required: [ window ]
                    rateLimits:
                      type: array
                      description: The limits of the rate at which cloud events may be published, counted in fixed windows shared by all replicas
                      items:
                        type: object
                        properties:
                          partition:
                            type: string
                            enum:
                              - publisher
                              - source
                          limit:
                            type: integer
                            minimum: 1
                          period:
                            type: string
                            description: The period, as an ISO 8601 duration, the limit applies to. A long period, such as P1D, makes the limit a quota
                        required: [ partition, limit, period ]
                    feeds:
                      type: array
                      description: The Kafka topics, NATS subjects or AMQP queues the gateway consumes cloud events from, in addition to its HTTP endpoint. Each is the name of a feed, or a feed of the gateway's own, with a name and an endpoint
                      items:
                        x-kubernetes-preserve-unknown-fields: true
                        oneOf:
                          - type: string
                          - type: object
                            properties:
                              name:
                                type: string
                                description: The name of the feed, which identifies it as the publisher of the cloud events it carries
                              endpoint:
                                description: The endpoint of the feed, either an address or an object with an address and how to authenticate to it
                                x-kubernetes-preserve-unknown-fields: true
                            required: [ name, endpoint ]
                    publishers:
                      type: array
                      description: The publishers allowed to publish cloud events to the gateway. Anyone the cluster's ingestion authentication admits may publish if not set
                      items:
                        type: object
                        properties:
                          name:
                            type: string
                            description: The publisher's name, which identifies it in rate limits and metrics
                          apiKey:
                            type: object
                            description: The API key that identifies the publisher, preferably read from a secret of the gateway's namespace with 'use'
                            x-kubernetes-preserve-unknown-fields: true
                          subject:
                            type: string
                            description: The subject ('sub' claim) of the bearer tokens that identify the publisher
                          claims:
                            type: object
                            description: The claims the bearer tokens that identify the publisher must all have
                            additionalProperties:
                              type: string
                          sources:
                            type: array
                            description: The patterns of the sources the publisher may publish cloud events of. Any if not set
                            items:
                              type: string
                        required: [ name ]
                workload:
                  type: object
                  description: The workload that runs the resource, which the operator deploys in Kubernetes mode. Ignored otherwise. The image, command, environment and service account are set by the operator's configuration only
                  properties:
                    replicas:
                      type: integer
                      minimum: 0
                      maximum: 100
                      description: The number of replicas to run. Defaults to the operator's configuration
                    resources:
                      type: object
                      description: The compute resources each replica requests and is limited to, as Kubernetes quantities
                      properties:
                        requests:
                          type: object
                          additionalProperties:
                            type: string
                        limits:
                          type: object
                          additionalProperties:
                            type: string
                    nodeSelector:
                      type: object
                      description: The labels of the nodes the replicas must run on
                      additionalProperties:
                        type: string
                    tolerations:
                      type: array
                      description: The Kubernetes tolerations of the replicas
                      items:
                        type: object
                    affinity:
                      type: object
                      description: The Kubernetes affinity of the replicas
                    topologySpreadConstraints:
                      type: array
                      description: The Kubernetes topology spread constraints of the replicas
                      items:
                        type: object
                    podLabels:
                      type: object
                      description: The labels added to the replicas, which can't override the ones the operator selects them by
                      additionalProperties:
                        type: string
                    podAnnotations:
                      type: object
                      description: The annotations added to the replicas
                      additionalProperties:
                        type: string
                    managementApi:
                      type: boolean
                      description: Whether or not the gateway serves the management API and the dashboard, for the resources of its own namespace only. Defaults to false
                    ingress:
                      type: object
                      description: The ingress that exposes the gateway's public endpoints, if any. Its annotations are set by the operator's configuration only
                      properties:
                        className:
                          type: string
                          description: The ingress class to use. Defaults to the operator's configuration, or to the cluster's default class
                        hosts:
                          type: array
                          minItems: 1
                          description: The hosts the gateway is exposed on, whose every path routes to it
                          items:
                            type: string
                        tlsSecretName:
                          type: string
                          description: The secret, in the gateway's namespace, that holds the TLS certificate of the hosts, if any
                      required: [ hosts ]
            status:
              type: object
              properties:
                healthStatus:
                  type: string
                lastHealthCheckAt:
                  type: string
                  format: date-time
                conditions:
                  type: array
                  description: The conditions of the workload, which the operator reports in Kubernetes mode
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: [ 'True', 'False', Unknown ]
                      reason:
                        type: string
                      message:
                        type: string
                      observedGeneration:
                        type: integer
                      lastTransitionTime:
                        type: string
                        format: date-time
                    required: [ type, status ]
                availableReplicas:
                  type: integer
                  description: The number of available replicas of the workload, which the operator reports in Kubernetes mode
          required:
            - spec
      subresources:
        status: {}
