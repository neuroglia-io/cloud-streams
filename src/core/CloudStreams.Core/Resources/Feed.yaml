apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: feeds.cloud-streams.io
spec:
  scope: Namespaced
  group: cloud-streams.io
  names:
    plural: feeds
    singular: feed
    kind: Feed
    shortNames:
    - fd
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              description: An endpoint gateways consume cloud events from, with the means to authenticate to it, which gateways refer to by name
              properties:
                endpoint:
                  description: The endpoint, either an address whose scheme selects the transport, or an object with an address and how to authenticate to it
                  x-kubernetes-preserve-unknown-fields: true
                  oneOf:
                    - type: string
                      format: uri
                    - type: object
                      properties:
                        uri:
                          type: string
                          format: uri
                        authentication:
                          type: object
                          description: Exactly one of basic, bearer, apiKey, oauth2 or oidc. Each holds its values, or names the secret that holds them with 'use'
                          x-kubernetes-preserve-unknown-fields: true
                      required: [ uri ]
              required: [ endpoint ]
          required:
            - spec
